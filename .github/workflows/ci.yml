name: CI Quality Gate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    name: Lint, Typecheck, Unit Tests & Build
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      APP_URL: http://localhost:3000
      AUTH_SECRET: ci_only_auth_secret_at_least_32_characters_long
      DATABASE_URL: postgresql://elward:elward_local_only@localhost:5432/elward_flow
      MINIO_ENDPOINT: http://localhost:9000
      MINIO_REGION: us-east-1
      MINIO_ACCESS_KEY: ci-only-access-key
      MINIO_SECRET_KEY: ci-only-secret-key
      MINIO_BUCKET: elward-flow-ci
      ADMIN_EMAIL: admin@example.test
      WORKER_POLL_INTERVAL_MS: 1000
      LOG_LEVEL: info

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: elward
          POSTGRES_PASSWORD: elward_local_only
          POSTGRES_DB: elward_flow
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Verify Code Formatting
        run: bun run format:check

      - name: Run ESLint
        run: bun run lint

      - name: Run TypeScript Typecheck
        run: bun run typecheck

      - name: Apply Database Migrations
        run: bun run db:migrate

      - name: Run Seed Data Verification
        run: bun run seed

      - name: Run Unit Tests
        run: bun run test:unit

      - name: Build Application
        run: bun run build
