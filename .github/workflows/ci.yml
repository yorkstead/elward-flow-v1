name: CI Quality Gate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    name: Quality, Integration, Browser Tests & Build
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      APP_URL: http://localhost:3000
      DATABASE_URL: postgresql://elward:elward_local_only@localhost:5432/elward_flow
      MINIO_ENDPOINT: http://localhost:9000
      MINIO_REGION: us-east-1
      MINIO_ACCESS_KEY: ci-only-access-key
      MINIO_SECRET_KEY: ci-only-secret-key
      MINIO_BUCKET: elward-flow-ci
      ADMIN_EMAIL: admin@example.test
      WORKER_POLL_INTERVAL_MS: 1000
      LOG_LEVEL: info

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: elward
          POSTGRES_PASSWORD: elward_local_only
          POSTGRES_DB: elward_flow
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Generate Ephemeral Test Secrets
        shell: bash
        run: |
          auth_secret="$(openssl rand -base64 48)"
          admin_password="CI-$(openssl rand -hex 24)!"
          echo "::add-mask::$auth_secret"
          echo "::add-mask::$admin_password"
          echo "AUTH_SECRET=$auth_secret" >> "$GITHUB_ENV"
          echo "E2E_ADMIN_PASSWORD=$admin_password" >> "$GITHUB_ENV"

      - name: Audit Production Dependencies
        run: bun audit --production

      - name: Verify Code Formatting
        run: bun run format:check

      - name: Run ESLint
        run: bun run lint

      - name: Run TypeScript Typecheck
        run: bun run typecheck

      - name: Apply Database Migrations
        run: bun run db:migrate

      - name: Start Object Storage
        run: >-
          docker run --detach --name elward-flow-ci-minio
          --publish 9000:9000
          --env MINIO_ROOT_USER=ci-only-access-key
          --env MINIO_ROOT_PASSWORD=ci-only-secret-key
          minio/minio:latest server /data

      - name: Wait for Object Storage
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:9000/minio/health/live > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs elward-flow-ci-minio
          exit 1

      - name: Initialize Object Storage Bucket
        run: >-
          bun -e "import { getFileStore } from './lib/files/minio-file-store';
          await getFileStore().ensureReady();
          console.log('Object storage bucket ready')"

      - name: Run Seed Data Verification
        run: bun run seed

      - name: Run Unit Tests
        run: bun run test:unit

      - name: Run Database Integration Tests
        run: bun run test:integration

      - name: Build Application
        run: bun run build

      - name: Install Chromium
        run: bun x playwright install --with-deps chromium

      - name: Run Browser Tests
        env:
          NODE_ENV: production
        run: bun run test:e2e
