<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 90" width="420" height="90">
  <defs>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B334F" />
      <stop offset="100%" stop-color="#0F2033" />
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F26A36" />
      <stop offset="100%" stop-color="#D4501E" />
    </linearGradient>
  </defs>

  <!-- Architectural Mark: Overlapping Facade Panels -->
  <g transform="translate(4, 6)">
    <!-- Base Panel -->
    <path d="M 8 16 L 46 6 L 68 34 L 30 44 Z" fill="url(#panelGrad)" opacity="0.95" />
    <!-- Foreground Rainscreen Facet (Orange) -->
    <path d="M 24 38 L 62 28 L 78 66 L 40 76 Z" fill="url(#orangeGrad)" />
    <!-- Secondary Precision Cut Layer -->
    <path d="M 12 48 L 36 42 L 48 70 L 24 76 Z" fill="#0063A6" opacity="0.85" />
    <!-- Architectural Joint Reveal Line -->
    <line x1="24" y1="38" x2="40" y2="76" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Brand Typography -->
  <text x="96" y="52" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="38" font-weight="900" letter-spacing="2.5" fill="#1B334F">ELLWOOD</text>
  <text x="98" y="74" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="4.5" fill="#64748B">ARCHITECTURAL SYSTEMS</text>
</svg>
